<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background circle with subtle gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="primary" x1="128" y1="128" x2="384" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accent" x1="256" y1="128" x2="256" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)" stroke="url(#primary)" stroke-width="3"/>

  <!-- Building blocks / kanban-style icon -->
  <!-- Top block -->
  <rect x="148" y="128" width="216" height="56" rx="12" fill="url(#primary)"/>
  <!-- Middle block (shorter, offset) -->
  <rect x="148" y="204" width="168" height="56" rx="12" fill="url(#accent)" opacity="0.8"/>
  <!-- Bottom block (medium) -->
  <rect x="148" y="280" width="192" height="56" rx="12" fill="url(#primary)" opacity="0.6"/>

  <!-- Sparkle / AI indicator -->
  <circle cx="388" cy="232" r="24" fill="url(#primary)"/>
  <path d="M388 216 L391 228 L403 232 L391 236 L388 248 L385 236 L373 232 L385 228 Z" fill="white"/>

  <!-- Small dot accent -->
  <circle cx="380" cy="156" r="8" fill="#818cf8" opacity="0.5"/>
  <circle cx="396" cy="308" r="6" fill="#6366f1" opacity="0.4"/>
</svg>
